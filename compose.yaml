services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: anpay
      POSTGRES_USER: anpay
      POSTGRES_PASSWORD: anpay_local
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anpay -d anpay"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
